<!-- templates/products/product_list.html -->
{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <h2 class="mb-4 text-center">Desalination Units</h2>
  <div class="row">
    {% for product in products %}
    <div class="col-md-4 mb-4">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text">{{ product.description|truncatechars:100 }}</p>
          <p class="card-text"><strong>£{{ product.price }}</strong></p>
          <div class="btn-group w-100">
            <a href="{% url 'products:detail' product.pk %}" class="btn btn-primary">View Details</a>
            <a href="{% url 'subscriptions:subscribe' product.pk %}" class="btn btn-success">Subscribe</a>
          </div>
        </div>
      </div>
    </div>
    {% empty %}
    <div class="col-12 text-center">
      <p>No products available.</p>
    </div>
    {% endfor %}
  </div>
  <div class="text-center mt-3">
    <a href="{% url 'products:list' %}" class="btn btn-secondary">View All Products</a>
  </div>
</div>
{% endblock %}
