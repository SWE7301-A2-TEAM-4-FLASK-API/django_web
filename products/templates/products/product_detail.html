{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <div class="row g-4">
    <div class="col-12 col-md-6">
      <div class="bg-light rounded d-flex align-items-center justify-content-center" style="min-height:240px;">
        <span class="text-muted">Product image</span>
      </div>
    </div>
    <div class="col-12 col-md-6">
      <h2>{{ product.name }}</h2>
      <p>{{ product.description }}</p>
      <p><strong>Price:</strong> £{{ product.price }}</p>
      {% if product.stock > 0 %}
        <div class="btn-group">
          <a href="{% url 'subscriptions:subscribe' product.pk %}" class="btn btn-success">Subscribe</a>
          <a href="{% url 'products:list' %}" class="btn btn-outline-secondary">Back</a>
        </div>
      {% else %}
        <p class="text-danger">Out of stock</p>
        <a href="{% url 'products:list' %}" class="btn btn-outline-secondary">Back</a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
