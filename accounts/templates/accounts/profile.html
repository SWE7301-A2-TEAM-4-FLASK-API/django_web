{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-body">
          <h2 class="mb-4 text-center">User Profile</h2>
          <ul class="list-group mb-4">
            <li class="list-group-item"><strong>Username:</strong> {{ user.username }}</li>
            <li class="list-group-item"><strong>Email:</strong> {{ user.email }}</li>
            <li class="list-group-item"><strong>Role:</strong> {{ user.role }}</li>
          </ul>
          <div class="mb-4">
            <label for="apiToken" class="form-label"><strong>Authorization Access Token</strong></label>
            <div class="input-group">
              <input type="text" id="apiToken" class="form-control" value="{{ api_token }}" readonly>
              <button class="btn btn-outline-secondary" type="button" onclick="navigator.clipboard.writeText(document.getElementById('apiToken').value)">Copy</button>
            </div>
            <small class="text-muted">Use this token to access the Flask APIs.</small>
          </div>
          <div class="d-flex justify-content-between">
            <a href="{% url 'accounts:update' %}" class="btn btn-warning">Edit Profile</a>
            <a href="{% url 'subscriptions:list' %}" class="btn btn-info">My Subscriptions</a>
            <a href="{% url 'accounts:logout' %}" class="btn btn-secondary">Logout</a>
              <a href="{% url 'accounts:enable_2fa' %}" class="btn btn-success">Enable Two-Factor Authentication</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
