{% extends 'base.html' %}
{% block content %}
<div class="container mt-4" style="max-width: 720px;">
  <h2>Subscribe to {{ product.name }}</h2>
  <form method="post" class="mt-3">
    {% csrf_token %}

    <div class="mb-3 form-check">
      <input class="form-check-input" type="checkbox" id="renewal" name="renewal">
      <label class="form-check-label" for="renewal">Enable auto-renewal</label>
      <div class="form-text">Leave unchecked if you don't want automatic renewal.</div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="payment_method">Payment method</label>
      <select class="form-select" id="payment_method" name="payment_method" required>
        <option value="" selected disabled>Choose a payment method</option>
        <option value="card">Credit/Debit Card</option>
        <option value="paypal">PayPal</option>
        <option value="bank">Bank Transfer</option>
        <option value="mobile">Mobile Money</option>
      </select>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Subscribe</button>
      <a href="{% url 'products:list' %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
