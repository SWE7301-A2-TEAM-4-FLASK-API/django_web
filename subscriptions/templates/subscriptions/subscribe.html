{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body">
          <h2 class="mb-4 text-center">Subscribe to Product</h2>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100">Subscribe</button>
          </form>
          <div class="mt-3 text-center">
            <a href="{% url 'products:list' %}" class="btn btn-link">Back to Products</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
